[package]
name = "mergevideoxdm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Interface graphique Linux modulaire pour assembler les segments HLS temporaires de XDM avec FFmpeg"
license = "MIT"
repository = "https://github.com/TkAbeleon/MergeVideoXDM"
readme = "README.md"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "svg", "tokio", "x11", "wayland", "linux-theme-detection"] }
rfd = { version = "0.16.0", default-features = false, features = ["xdg-portal", "tokio", "wayland"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tempfile = "3.23"
url = "2.5"
percent-encoding = "2.3"

[package.metadata.deb]
maintainer = "TkAbeleon"
copyright = "2026, TkAbeleon"
extended-description = "Interface de bureau pour reconstruire des vidéos issues de téléchargements temporaires XDM en utilisant FFmpeg, sans réencodage et sans modifier les fichiers sources."
depends = ["ffmpeg", "$auto"]
section = "video"
priority = "optional"
assets = [
    ["target/release/mergevideoxdm", "usr/bin/", "755"],
    ["packaging/mergevideoxdm.desktop", "usr/share/applications/", "644"],
    ["assets/icons/app-mark.svg", "usr/share/icons/hicolor/scalable/apps/mergevideoxdm.svg", "644"],
    ["README.md", "usr/share/doc/mergevideoxdm/README.md", "644"],
    ["LICENSE", "usr/share/doc/mergevideoxdm/copyright", "644"],
]

[package.metadata.generate-rpm]
name = "mergevideoxdm"
assets = [
    { source = "target/release/mergevideoxdm", dest = "/usr/bin/mergevideoxdm", mode = "755" },
    { source = "packaging/mergevideoxdm.desktop", dest = "/usr/share/applications/mergevideoxdm.desktop", mode = "644" },
    { source = "assets/icons/app-mark.svg", dest = "/usr/share/icons/hicolor/scalable/apps/mergevideoxdm.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/mergevideoxdm/README.md", doc = true, mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/mergevideoxdm/LICENSE", doc = true, mode = "644" },
]

[package.metadata.generate-rpm.requires]
ffmpeg = "*"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1
